<!doctype html>
<html lang="fr" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messagerie - Dashboard</title>

  <link rel="stylesheet" href="../../src/styles/output.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="../../mvm.css" />
</head>
<body class="h-full overflow-x-hidden">
  <div class="bg"></div>
  <div class="bg bg2"></div>
  <div class="bg bg3"></div>

  <div class="flex flex-col h-full justify-center gap-3 px-2 py-2 sm:flex-row sm:gap-5 sm:px-3 sm:py-3 relative z-0">
    <input id="menuToggle" type="checkbox" class="peer sr-only" />
    <label for="menuToggle" class="fixed inset-0 z-40 hidden bg-black/50 lg:hidden peer-checked:block"></label>

    <!-- Sidebar -->
    <aside class="sidebar shadow-interieur">
      <label for="menuToggle" class="ml-auto flex h-10 w-10 items-center justify-center rounded-full border border-white/20 bg-white/10 text-white lg:hidden" aria-label="Fermer le menu">
        <i class="bi bi-x icon-size"></i>
      </label>
      <img src="../../assets/Logo.svg" alt="" class="mx-auto w-full max-w-[100px] sm:max-w-[120px] md:max-w-[150px] xl:max-w-full" />
      <div class="flex w-full flex-col gap-1 sm:gap-2 mt-4 sm:mt-0">
        <a href="../dashboard/index.html" class="w-full"><span class="sidebar-link">Dashboard &gt;</span></a>
        <a href="../users/index.html" class="w-full"><span class="sidebar-link">Utilisateurs &gt;</span></a>
        <a href="../messages/index.html" class="w-full"><span class="sidebar-link sidebar-link-active">Messagerie &gt;</span></a>
        <a href="../tasks/index.html" class="w-full"><span class="sidebar-link">Tâches &gt;</span></a>
        <a href="#" class="w-full"><span class="sidebar-link">Calendrier &gt;</span></a>
        <a href="../account/index.html" class="w-full"><span class="sidebar-link">Comptes &gt;</span></a>
      </div>
    </aside>

    <!-- Contenu principal -->
    <div class="flex h-full min-w-0 flex-col gap-4 w-full">
      <!-- En-tête -->
      <header class="flex flex-col gap-3 rounded shadow-interieur bg-white/10 px-3 py-3 sm:flex-row sm:items-center sm:justify-between sm:py-4 sm:h-35">
        <div class="flex items-center gap-2">
          <!-- Bouton burger mobile -->
          <label for="menuToggle" class="flex items-center justify-center rounded border border-white/20 bg-white/10 p-2 text-white sm:hidden" aria-label="Ouvrir le menu">
            <i class="bi bi-list icon-size"></i>
          </label>
          <div class="flex flex-col gap-2">
            <h1 class="flex text-xl text-white sm:text-2xl">Bonjour, Aïcha Diop</h1>
            <span class="flex flex-wrap items-center gap-2 text-gray-300">
              <i class="bi bi-house-fill text-white text-sm sm:text-base lg:text-xl xl:text-2xl"></i>
              &gt;
              <p>tableau de board</p>
            </span>
          </div>
        </div>

        <!-- Icônes de droite -->
        <div class="flex flex-wrap items-center justify-end gap-2 sm:gap-1">
          <i class="bi bi-gear icon-size text-3xl text-white"></i>
          <div class="relative">
            <span class="flex absolute w-2 h-2 border top-0 right-0 bg-brand rounded-full"></span>
            <i class="bi bi-bell icon-size text-white"></i>
          </div>
          <a href="../auth/index.html">
            <i class="bi bi-person icon-size text-white"></i>
          </a>
        </div>
      </header>

      <!-- Zone principale de messagerie -->
      <main class="flex flex-col shadow-interieur bg-white/20 p-2 sm:p-4 w-full flex-1 backdrop-blur rounded-lg overflow-y-auto no-scrollbar">
        <!-- Onglets -->
        <div class="flex shadow-interieur flex-wrap relative lg:flex-nowrap rounded-lg bg-white/20 border-2 border-white/20 px-2 sm:px-4 lg:px-14 py-2 lg:py-1 justify-center lg:justify-between gap-2 lg:gap-0 text-white z-10">
          <!-- Onglet Réception -->
          <label class="cursor-pointer">
            <input name="recep" type="radio" class="hidden peer" checked />
            <div class="tab-label peer-checked:tab-active">
              <i class="bi bi-envelope text-lg lg:text-2xl"></i>
              <p>Réception</p>
            </div>
            <div class="tab-panel shadow-interieur hidden peer-checked:flex flex-col gap-3 lg:gap-2">
              <!-- Barre d'actions messages -->
              <div class="flex rounded-lg text-xl lg:text-3xl px-3 lg:px-6 py-3 lg:py-4 justify-between text-white flex-wrap gap-4">
                <div class="flex gap-4 lg:gap-3 items-center">
                  <div class="flex items-center">
                    <input type="checkbox" class="table-checkbox" aria-label="Tout sélectionner" />
                  </div>
                  <i class="bi bi-trash3 cursor-pointer hover:text-red-400 transition-colors"></i>
                  <i class="bi bi-envelope-open cursor-pointer hover:text-gray-300 transition-colors"></i>
                  <i class="bi bi-folder cursor-pointer hover:text-gray-300 transition-colors"></i>
                  <i class="bi bi-tag cursor-pointer hover:text-gray-300 transition-colors"></i>
                </div>
                <div class="flex items-center gap-4 lg:gap-3">
                  <i class="bi bi-arrow-clockwise cursor-pointer hover:text-gray-300 transition-colors"></i>
                  <i class="bi bi-three-dots-vertical cursor-pointer hover:text-gray-300 transition-colors"></i>
                </div>
              </div>

              <!-- Lignes de messages -->
              <div class="message-row">
                <div class="flex gap-4 w-full lg:w-1/3 text-xl lg:text-3xl items-center">
                  <input type="checkbox" class="table-checkbox" />
                  <i class="bi bi-pin-angle"></i>
                </div>
                <div class="flex items-center w-full lg:w-[60%] gap-3">
                  <div class="user-avatar">AS</div>
                  <p class="font-medium text-sm lg:text-base">S. Traoré</p>
                </div>
                <div class="w-full lg:w-[60%] flex flex-col justify-center">
                  <p class="font-semibold text-sm lg:text-base">Rapport du cas du client</p>
                  <p class="text-xs lg:text-sm text-gray-200">N°00000</p>
                </div>
                <div class="w-full lg:w-[80%] flex items-center">
                  <p class="text-sm lg:text-base text-gray-200 line-clamp-2 lg:line-clamp-1">Lorem ipsum dolor sit dioka ipsum...</p>
                </div>
                <div class="w-full lg:w-[20%] flex items-center justify-end lg:justify-start">
                  <p class="text-xs lg:text-sm text-gray-300">08:23 AM</p>
                </div>
              </div>
              <!-- Dupliquer message-row pour autant de messages que nécessaire -->
            </div>
          </label>

          <!-- Onglet Envoi -->
          <label class="cursor-pointer">
            <input name="recep" type="radio" class="hidden peer" />
            <div class="tab-label peer-checked:tab-active">
              <i class="bi bi-send text-lg lg:text-2xl"></i>
              <p>Envoi</p>
            </div>
            <div class="tab-panel hidden peer-checked:flex flex-col gap-3 lg:gap-2">
              <p class="text-white p-4">Boîte d'envoi vide...</p>
            </div>
          </label>

          <!-- Onglet Brouillon -->
          <label class="cursor-pointer">
            <input name="recep" type="radio" class="hidden peer" />
            <div class="tab-label peer-checked:tab-active">
              <i class="bi bi-envelope text-lg lg:text-2xl"></i>
              <p>Brouillon</p>
            </div>
            <div class="tab-panel hidden peer-checked:flex">Brouillons vides...</div>
          </label>

          <!-- Onglet Épinglé -->
          <label class="cursor-pointer">
            <input name="recep" type="radio" class="hidden peer" />
            <div class="tab-label peer-checked:tab-active">
              <i class="bi bi-pin-angle text-lg lg:text-2xl"></i>
              <p>Épinglé</p>
            </div>
            <div class="tab-panel hidden peer-checked:flex">Aucun message épinglé.</div>
          </label>

          <!-- Onglet Spam -->
          <label class="cursor-pointer">
            <input name="recep" type="radio" class="hidden peer" />
            <div class="tab-label peer-checked:tab-active">
              <i class="bi bi-envelope-exclamation text-lg lg:text-2xl"></i>
              <p>Spam</p>
            </div>
            <div class="tab-panel hidden peer-checked:flex">Aucun spam.</div>
          </label>

          <!-- Onglet Corbeille -->
          <label class="cursor-pointer">
            <input name="recep" type="radio" class="hidden peer" />
            <div class="tab-label peer-checked:tab-active">
              <i class="bi bi-trash3 text-lg lg:text-2xl"></i>
              <p>Corbeille</p>
            </div>
            <div class="tab-panel hidden peer-checked:flex">Corbeille vide.</div>
          </label>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
